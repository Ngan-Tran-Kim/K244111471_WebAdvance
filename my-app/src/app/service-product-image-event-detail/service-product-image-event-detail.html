<div class="detail-wrapper">
  <button type="button" (click)="goBack()" class="go-back-btn">Go Back</button>

  <div *ngIf="selectedProduct" class="detail-card">
    <img [src]="selectedProduct.Image" [alt]="selectedProduct.ProductName" width="180" height="180" />
    <p><strong>ID:</strong> {{ selectedProduct.ProductId }}</p>
    <p><strong>Name:</strong> {{ selectedProduct.ProductName }}</p>
    <p><strong>Price:</strong> {{ selectedProduct.Price }}</p>
  </div>
</div>
