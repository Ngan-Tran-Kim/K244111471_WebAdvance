<p>product-list-call-service-component works!</p>
min price: <input type="number" [(ngModel)]="minPrice" />
max price: <input type="number" [(ngModel)]="maxPrice" />
<button type="button" (click)="callFilterProductListByPrice()">Filter</button>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>NAME</th>
      <th>PRICE</th>
      <th>IMAGE</th>
    </tr>
  </thead>
  <tbody>
    @for (product of products; track product.id) {
      <tr [class.invalid_product]="product.price < 0">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price | currency:'USD' }}</td>
        <td>
          <img [src]="product.imageUrl" height="100" width="100" [alt]="product.name" />
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No products available.</td>
      </tr>
    }
  </tbody>
</table>
