<div class="product-list-wrapper">
  <table border="1" cellpadding="8" cellspacing="0" class="product-table">
    <tr>
      <th>Product ID</th>
      <th>Product Name</th>
      <th>UnitPrice</th>
      <th>Picture</th>
      <th>#</th>
    </tr>
    <tr *ngFor="let p of products">
      <td>{{ p.ProductId }}</td>
      <td>{{ p.ProductName }}</td>
      <td>{{ p.Price }}</td>
      <td>
        <img [src]="p.Image" [alt]="p.ProductName" width="110" height="110" />
      </td>
      <td>
        <a href="javascript:void(0)" (click)="viewDetail(p)">Details</a>
      </td>
    </tr>
  </table>
</div>
